name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [sdk, mcp, cli]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: packages/${{ matrix.package }}
        run: bun install
      - name: Build
        working-directory: packages/${{ matrix.package }}
        run: bun run build
      - name: Typecheck
        working-directory: packages/${{ matrix.package }}
        run: bun run typecheck
      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: bun test
